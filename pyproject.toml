[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyphex"
version = "0.1.0"
description = "AI-powered security scanner with adversarial immune system — runs 100% locally"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["security", "scanner", "vulnerability", "ai", "immune-system", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "rich>=13.0.0",
    # mascot.py's real pixel-art rendering (frame compositing/brightness via
    # ImageEnhance, plus the Tier 1-3 backends in mascot_backend_image.py /
    # mascot_backend_halfblock.py) — always imported defensively, so a
    # missing Pillow just degrades to the Tier 0 plain-glyph fallback rather
    # than breaking anything, but it's a real declared dependency now.
    "pillow>=10.0.0",
    # stdlib readline is POSIX-only — Windows CPython ships without it, and
    # cx.py's interactive workspace degrades to no-tab-completion/no-history
    # without this shim (see cx.py's guarded import).
    "pyreadline3; sys_platform == 'win32'",
    # cyphex_cli.py's `class C` prints raw ANSI escape codes directly with
    # no Rich fallback (unlike cx.py/terminal_ui.py) — on legacy Windows
    # cmd.exe without native VT processing enabled, those render as literal
    # escape-sequence garbage instead of color. colorama translates/strips
    # them there and is close to a no-op everywhere else.
    "colorama; sys_platform == 'win32'",
]

[project.optional-dependencies]
cloud = ["openai>=1.0.0"]
reasoning = ["agent-reasoning>=1.0.8"]
memory = ["cognee[ollama]>=1.2.0,<2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]


[project.scripts]
cyphex = "cyphex.cli:main"

[tool.setuptools]
# Top-level engine modules that live at the repo root (outside the cyphex/
# package) but are imported by cyphex.cli. Declared so an editable install
# (`pip install -e .`) exposes them and `cyphex` can open the workspace.
py-modules = [
    "cli_engine", "cx", "terminal_ui", "cyphex_cli", "cyphex_benchmark", "mascot",
    # mascot.py's tiered pixel-art rendering backends + the opt-in separate-
    # terminal-window companion — sibling top-level modules it imports
    # defensively at runtime, so an installed (not just in-repo) build can
    # still resolve them.
    "mascot_backend_image", "mascot_backend_halfblock",
    "mascot_companion", "mascot_companion_loop",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cyphex*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests drive real local models (cognee cognify via Ollama) and take
# minutes, so `pytest` runs the fast suite by default. Opt in with:
#   pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: hits real local models/stores — slow, needs Ollama running",
]
